<style>
:root{--bg:#f7f6f3;--paper:#fff;--ink:#2f2b27;--muted:#77716a;--line:#e7e2dc;--accent:#2563eb;--soft:#f3f6fb;--red:#b7443e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.wrap{max-width:1240px;margin:auto;padding:38px 24px 80px}.back{color:var(--muted);text-decoration:none}.hero{margin:28px 0 22px;padding:34px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}.kicker{color:var(--accent);font:700 11px ui-monospace,monospace;letter-spacing:.1em}.hero h1{font-size:38px;line-height:1.15;margin:10px 0}.hero p{max-width:780px;color:var(--muted);font-size:15px}.stats{display:flex;gap:28px;margin-top:22px}.stats strong{font-size:24px}.stats span{display:block;color:var(--muted);font-size:11px}.notice{padding:14px 18px;border:1px solid #eadfc5;background:#fff9e9;border-radius:10px;color:#685a3c}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.chip{border:1px solid var(--line);background:var(--paper);padding:8px 12px;border-radius:8px;cursor:pointer}.chip.active{background:var(--ink);color:#fff}.grid{display:grid;gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}.card-head{padding:22px 24px;border-bottom:1px solid var(--line)}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font:11px ui-monospace,monospace}.badge{padding:2px 7px;border-radius:4px;background:var(--soft)}.card h2{font-size:22px;line-height:1.35;margin:10px 0 6px}.tension{color:var(--muted);margin:0}.why{margin:14px 0 0;padding:12px;background:var(--soft);border-radius:7px}.platforms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.variant{padding:20px 22px;border-right:1px solid var(--line)}.variant:last-child{border-right:0}.variant h3{margin:0 0 10px;font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}.variant h4{font-size:16px;line-height:1.45;margin:0 0 8px}.hook{color:var(--muted)}ol{padding-left:20px}.copy{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 10px;cursor:pointer}.copy:hover{background:var(--soft)}.boundary{padding:14px 22px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.boundary strong{color:var(--red)}.hidden{display:none}@media(max-width:900px){.platforms{grid-template-columns:1fr}.variant{border-right:0;border-bottom:1px solid var(--line)}.variant:last-child{border-bottom:0}.hero h1{font-size:30px}.stats{gap:16px;flex-wrap:wrap}}
</style></head><body><main class="wrap"><a class="back" href="index.html">← 返回 AI Signal 日报</a><section class="hero"><div class="kicker">CONTENT TOPIC STUDIO · 当日增量 · 2026-09-12</div><h1>AI Signal 自媒体选题工作台</h1><p>同一份一手证据，分别为小红书、X / Twitter 和公众号设计不同表达。自动生成只进入候选池；人工选择后才进入写作和发布。</p><div class="stats"><div><strong id="topicCount"></strong><span>母选题</span></div><div><strong id="variantCount"></strong><span>平台版本</span></div><div><strong>3</strong><span>发布平台</span></div></div></section><div class="notice"><strong>证据边界：</strong>标题可以提出判断，但事实、官方自报、作者个人经验和推断必须分开。没有逐字稿或独立复现时，不制造观点、原话和效果结论。</div><div class="toolbar" id="filters"><button class="chip active" data-filter="all">全部</button><button class="chip" data-filter="xiaohongshu">小红书</button><button class="chip" data-filter="twitter">X / Twitter</button><button class="chip" data-filter="wechat">公众号</button><button class="chip" data-filter="A">A级选题</button><button class="chip" data-filter="B">B级选题</button></div><section class="grid" id="grid"></section></main><script>const DATA={"schema_version": 1, "report_date": "2026-09-12", "timezone": "Asia/Shanghai", "disclaimer_cn": "个人独立 AI 研究内容，不代表任何公司或机构。自动流程只生成 candidate，不自动发布。", "scope_label_cn": "当日增量 · 2026-09-12", "source_scope": {"type": "daily", "date": "2026-09-12"}, "topics": [{"id": "2026-09-12-coding-agent-secret-injection-control-plane", "status": "candidate", "timeliness": "this_week", "priority": "A", "topic_lane": "ai_product", "source_signal_ids": ["2026-09-08-1password-codex-secure-engineering-workflow"], "working_title_cn": "企业 Coding Agent 的安全边界，不该只写在 Prompt 里", "core_tension_cn": "Agent 要深入研发链路才能产生价值，但凭据、工具授权和生产交接不能跟着自动化一起失控。", "why_now_cn": "1Password 首次公开了 Codex 覆盖需求、实现、PR、测试和故障调查的用法，也写明凭据只在获批工具调用的动作点注入。", "target_audience_cn": ["AI 产品经理", "企业开发平台负责人", "Agent 安全与治理团队"], "evidence_boundary_cn": "工作流和内部测量来自 OpenAI 与 1Password 客户案例；没有真实管理员 UI、审计日志、暂停和回滚证据，ROI 也不是独立评测。", "source_urls": ["https://openai.com/index/1password"], "platforms": {"xiaohongshu": {"title": "AI 写代码可以，凭什么拿到你的生产密钥？", "hook": "1Password 把 Codex 接进整条研发链路，但明文凭据不进模型上下文，只在获批工具真正执行时注入。", "format": "8页图文卡", "outline": ["完整研发链路", "模型能自动做什么", "人工在哪里接手", "secret reference 怎么工作", "AppSec skill 的位置", "缺失的日志与回滚证据", "企业评估清单"], "visual_direction": "从需求到生产的泳道图，标出凭据注入点和人工交接点", "cta": "你的 Agent 在哪个动作点才拿到凭据？"}, "twitter": {"title": "The useful part of 1Password's Codex case is secret injection, not the ROI headline", "hook": "Codex spans planning, implementation, review, testing, and incident investigation at 1Password. Plaintext credentials stay out of model context and are injected only when an approved tool acts.", "format": "7帖 Thread", "outline": ["case-study boundary", "workflow map", "human handoff", "secret references", "AppSec skills", "self-reported metrics", "missing controls"], "visual_direction": "tool-call authorization and secret-injection sequence diagram", "cta": "Where does your coding agent receive credentials, and who can revoke them?"}, "wechat": {"title": "Coding Agent 进入企业研发链路后，凭据、工具和人审应该怎么分层", "hook": "1Password 的案例给出了一条可拆解的企业路径：Agent 覆盖研发全链路，但凭据按动作注入，后端生产落地仍交给工程师。", "format": "2000—2600字分析", "outline": ["案例事实与自报边界", "研发工作流拆解", "凭据按动作注入", "AppSec skill 与工具授权", "人工交接和责任链", "日志、暂停、回滚缺口", "企业控制面清单"], "visual_direction": "对象—动作—凭据—审批—日志矩阵", "cta": "附一份企业 Coding Agent 上线前核对表。"}}}]};const labels={xiaohongshu:'小红书',twitter:'X / Twitter',wechat:'公众号'};let active='all';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function writeClipboard(text){try{if(!navigator.clipboard?.writeText)throw new Error('Clipboard API unavailable');await navigator.clipboard.writeText(text);return'copied'}catch(e){const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();const ok=document.execCommand('copy');area.remove();if(ok)return'copied';const shade=document.createElement('div');shade.style.cssText='position:fixed;inset:0;background:#0008;z-index:99;display:grid;place-items:center;padding:24px';const panel=document.createElement('div');panel.style.cssText='width:min(720px,100%);background:white;padding:20px;border-radius:12px';const note=document.createElement('p');note.textContent='浏览器不允许自动写入剪贴板。文本已选中，请按 ⌘C 复制。';const manual=document.createElement('textarea');manual.value=text;manual.setAttribute('readonly','');manual.style.cssText='width:100%;height:45vh;padding:12px;border:1px solid #ddd';const close=document.createElement('button');close.textContent='完成';close.style.cssText='margin-top:12px;padding:8px 16px';close.onclick=()=>shade.remove();panel.append(note,manual,close);shade.appendChild(panel);document.body.appendChild(shade);manual.focus();manual.select();return'manual'}}function copyVariant(topic,p,btn){const v=topic.platforms[p];const text=`${labels[p]}选题：${v.title}

开头：${v.hook}

形式：${v.format}

结构：
${v.outline.map((x,i)=>`${i+1}. ${x}`).join('\n')}

视觉：${v.visual_direction}

CTA：${v.cta}

证据边界：${topic.evidence_boundary_cn}

来源：${topic.source_urls.join('\n')}`;writeClipboard(text).then(result=>{btn.textContent=result==='manual'?'已选中，请按 ⌘C':'已复制 ✓';setTimeout(()=>btn.textContent='复制选题',2200)}).catch(()=>{btn.textContent='请手动复制';setTimeout(()=>btn.textContent='复制选题',2200)})}function render(){const grid=document.getElementById('grid');grid.innerHTML='';DATA.topics.forEach(t=>{if(active==='A'||active==='B'){if(t.priority!==active)return}const platforms=Object.entries(t.platforms).map(([p,v])=>`<section class="variant ${active!=='all'&&active!==p&&active!=='A'&&active!=='B'?'hidden':''}"><h3>${labels[p]}</h3><h4>${esc(v.title)}</h4><p>${esc(v.hook)}</p><small>${esc(v.format)}</small><ol>${v.outline.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p class="visual"><strong>视觉：</strong>${esc(v.visual_direction)}</p><p><strong>CTA：</strong>${esc(v.cta)}</p><button class="copy">复制选题</button></section>`).join('');const template=document.createElement('template');template.innerHTML='<article class="card"></article>';const card=template.content.firstElementChild;card.innerHTML=`<div class="card-head"><div class="meta"><span class="badge">${esc(t.status)}</span><span class="badge">${esc(t.priority)} 级</span><span class="badge">${esc(t.timeliness)}</span><span>${esc(t.topic_lane)}</span></div><h2>${esc(t.working_title_cn)}</h2><p class="tension">${esc(t.core_tension_cn)}</p><p class="why"><strong>为什么现在写：</strong>${esc(t.why_now_cn)}</p><details><summary>证据与读者</summary><p><strong>目标读者：</strong>${t.target_audience_cn.map(esc).join(' · ')}</p><p><strong>证据边界：</strong>${esc(t.evidence_boundary_cn)}</p><div class="sources">${t.source_urls.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noreferrer">原始 Signal 来源 ${i+1} ↗</a>`).join('')}</div></details></div><div class="platforms">${platforms}</div>`;card.querySelectorAll('.copy').forEach((btn,i)=>btn.onclick=()=>copyVariant(t,Object.keys(t.platforms)[i],btn));grid.appendChild(card)});document.getElementById('topicCount').textContent=DATA.topics.length;document.getElementById('variantCount').textContent=DATA.topics.length*3}document.querySelectorAll('.chip').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));btn.classList.add('active');active=btn.dataset.filter;render()}));render();</script></body></html>
