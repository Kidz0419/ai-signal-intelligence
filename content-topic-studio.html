px}.hook{color:var(--muted)}ol{padding-left:20px}.copy{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 10px;cursor:pointer}.copy:hover{background:var(--soft)}.boundary{padding:14px 22px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.boundary strong{color:var(--red)}.hidden{display:none}@media(max-width:900px){.platforms{grid-template-columns:1fr}.variant{border-right:0;border-bottom:1px solid var(--line)}.variant:last-child{border-bottom:0}.hero h1{font-size:30px}.stats{gap:16px;flex-wrap:wrap}}
</style></head><body><main class="wrap"><a class="back" href="index.html">← 返回 AI Signal 日报</a><section class="hero"><div class="kicker">CONTENT TOPIC STUDIO · 当日增量 · 2026-09-14</div><h1>AI Signal 自媒体选题工作台</h1><p>同一份一手证据，分别为小红书、X / Twitter 和公众号设计不同表达。自动生成只进入候选池；人工选择后才进入写作和发布。</p><div class="stats"><div><strong id="topicCount"></strong><span>母选题</span></div><div><strong id="variantCount"></strong><span>平台版本</span></div><div><strong>3</strong><span>发布平台</span></div></div></section><div class="notice"><strong>证据边界：</strong>标题可以提出判断，但事实、官方自报、作者个人经验和推断必须分开。没有逐字稿或独立复现时，不制造观点、原话和效果结论。</div><div class="toolbar" id="filters"><button class="chip active" data-filter="all">全部</button><button class="chip" data-filter="xiaohongshu">小红书</button><button class="chip" data-filter="twitter">X / Twitter</button><button class="chip" data-filter="wechat">公众号</button><button class="chip" data-filter="A">A级选题</button><button class="chip" data-filter="B">B级选题</button></div><section class="grid" id="grid"></section></main><script>const DATA={"schema_version": 1, "report_date": "2026-09-14", "timezone": "Asia/Shanghai", "disclaimer_cn": "个人独立 AI 研究内容，不代表任何公司或机构。自动流程只生成 candidate，不自动发布。", "scope_label_cn": "当日增量 · 2026-09-14", "source_scope": {"type": "daily", "date": "2026-09-14"}, "topics": [{"id": "2026-09-14-agent-control-is-more-than-permission-mode", "status": "candidate", "timeliness": "this_week", "priority": "A", "topic_lane": "agent_architecture", "source_signal_ids": ["2026-09-14-kimi-code-043-dynamic-tools-steering-controls"], "working_title_cn": "Agent 控制权不该只有一个“自动模式”开关", "core_tension_cn": "工具披露、人工打断、后台任务、上下文压缩和危险命令确认是五种不同控制权，压成一个自动/手动开关会掩盖风险。", "why_now_cn": "Kimi Code 0.43 同时改了 MCP 工具按需披露、steering 中断等待、compaction 重试和 `rm -rf` 确认例外，正好提供了一组可落到字段与日志的 Agent 控制面样本。", "target_audience_cn": ["AI 产品经理", "Agent Runtime 开发者", "企业 AI 安全与治理团队"], "evidence_boundary_cn": "依据 Kimi Code 正式 Release 和已合并 PR。动态工具选择仍为实验能力，官方没有公开性能收益；steering 只释放等待，不等于取消后台任务；日志、暂停和回滚仍需产品实测。", "source_urls": ["https://github.com/MoonshotAI/kimi-code/releases/tag/%40moonshot-ai%2Fkimi-code%400.43.0"], "platforms": {"xiaohongshu": {"title": "Agent 的“自动模式”太粗了：至少要拆成 5 个开关", "hook": "能不能自动执行，只回答了一小部分问题。工具何时给模型、用户能否插话、后台任务是否停、压缩失败怎么重试、哪些命令免确认，都得单独设计。", "format": "8页图文卡", "outline": ["为什么自动/手动二分不够", "工具披露：inline 与 deferred", "人工 steering：打断等待但不取消任务", "后台任务的继续、暂停与取消", "上下文压缩的重试预算", "危险命令的确认例外", "统一审计时间线应该记录什么", "Agent 控制面验收清单"], "visual_direction": "一张五层控制面剖面图，分别标出默认值、用户动作、后台状态和审计事件", "cta": "你现在用的 Agent，能分清“打断等待”和“取消任务”吗？"}, "twitter": {"title": "Agent control is not one autonomy toggle", "hook": "Kimi Code 0.43 separates tool disclosure, human steering, background-task lifecycle, compaction retries, and command confirmation. Those controls need different defaults and logs.", "format": "7帖 Thread", "outline": ["why one autonomy toggle fails", "deferred MCP tool disclosure", "policy veto with disallowedTools", "steering versus cancellation", "compaction retry budgets", "dangerous-command exceptions", "minimum audit timeline"], "visual_direction": "state machine showing wait interrupted while the background task remains running", "cta": "Which of these controls does your agent expose and log today?"}, "wechat": {"title": "别再用一个“自动模式”管理 Agent：控制面至少要拆成五层", "hook": "Kimi Code 0.43 的价值不在又多了几个配置项，而在它把工具披露、人工插话、后台任务、压缩重试和命令确认拆成了不同的运行时契约。", "format": "2500—3200字产品分析", "outline": ["从 0.43 Release 看 Agent 控制权的拆分", "工具 schema 为什么不该全部常驻上下文", "按需加载的能力声明与策略否决", "steering、暂停、取消三个动作的差别", "compaction 重试预算如何进入运维", "危险命令例外的边界与审计", "统一运行时间线与管理员策略", "产品验收问题清单"], "visual_direction": "控制面字段表加状态机：配置层、策略层、运行层、审计层分开标注", "cta": "附一份可直接用于 Agent 产品评审的控制面字段清单。"}}}]};const labels={xiaohongshu:'小红书',twitter:'X / Twitter',wechat:'公众号'};let active='all';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function writeClipboard(text){try{if(!navigator.clipboard?.writeText)throw new Error('Clipboard API unavailable');await navigator.clipboard.writeText(text);return'copied'}catch(e){const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();const ok=document.execCommand('copy');area.remove();if(ok)return'copied';const shade=document.createElement('div');shade.style.cssText='position:fixed;inset:0;background:#0008;z-index:99;display:grid;place-items:center;padding:24px';const panel=document.createElement('div');panel.style.cssText='width:min(720px,100%);background:white;padding:20px;border-radius:12px';const note=document.createElement('p');note.textContent='浏览器不允许自动写入剪贴板。文本已选中，请按 ⌘C 复制。';const manual=document.createElement('textarea');manual.value=text;manual.setAttribute('readonly','');manual.style.cssText='width:100%;height:45vh;padding:12px;border:1px solid #ddd';const close=document.createElement('button');close.textContent='完成';close.style.cssText='margin-top:12px;padding:8px 16px';close.onclick=()=>shade.remove();panel.append(note,manual,close);shade.appendChild(panel);document.body.appendChild(shade);manual.focus();manual.select();return'manual'}}function copyVariant(topic,p,btn){const v=topic.platforms[p];const text=`${labels[p]}选题：${v.title}

开头：${v.hook}

形式：${v.format}

结构：
${v.outline.map((x,i)=>`${i+1}. ${x}`).join('\n')}

视觉：${v.visual_direction}

CTA：${v.cta}

证据边界：${topic.evidence_boundary_cn}

来源：${topic.source_urls.join('\n')}`;writeClipboard(text).then(result=>{btn.textContent=result==='manual'?'已选中，请按 ⌘C':'已复制 ✓';setTimeout(()=>btn.textContent='复制选题',2200)}).catch(()=>{btn.textContent='请手动复制';setTimeout(()=>btn.textContent='复制选题',2200)})}function render(){const grid=document.getElementById('grid');grid.innerHTML='';DATA.topics.forEach(t=>{if(active==='A'||active==='B'){if(t.priority!==active)return}const platforms=Object.entries(t.platforms).map(([p,v])=>`<section class="variant ${active!=='all'&&active!==p&&active!=='A'&&active!=='B'?'hidden':''}"><h3>${labels[p]}</h3><h4>${esc(v.title)}</h4><p>${esc(v.hook)}</p><small>${esc(v.format)}</small><ol>${v.outline.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p class="visual"><strong>视觉：</strong>${esc(v.visual_direction)}</p><p><strong>CTA：</strong>${esc(v.cta)}</p><button class="copy">复制选题</button></section>`).join('');const template=document.createElement('template');template.innerHTML='<article class="card"></article>';const card=template.content.firstElementChild;card.innerHTML=`<div class="card-head"><div class="meta"><span class="badge">${esc(t.status)}</span><span class="badge">${esc(t.priority)} 级</span><span class="badge">${esc(t.timeliness)}</span><span>${esc(t.topic_lane)}</span></div><h2>${esc(t.working_title_cn)}</h2><p class="tension">${esc(t.core_tension_cn)}</p><p class="why"><strong>为什么现在写：</strong>${esc(t.why_now_cn)}</p><details><summary>证据与读者</summary><p><strong>目标读者：</strong>${t.target_audience_cn.map(esc).join(' · ')}</p><p><strong>证据边界：</strong>${esc(t.evidence_boundary_cn)}</p><div class="sources">${t.source_urls.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noreferrer">原始 Signal 来源 ${i+1} ↗</a>`).join('')}</div></details></div><div class="platforms">${platforms}</div>`;card.querySelectorAll('.copy').forEach((btn,i)=>btn.onclick=()=>copyVariant(t,Object.keys(t.platforms)[i],btn));grid.appendChild(card)});document.getElementById('topicCount').textContent=DATA.topics.length;document.getElementById('variantCount').textContent=DATA.topics.length*3}document.querySelectorAll('.chip').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));btn.classList.add('active');active=btn.dataset.filter;render()}));render();</script></body></html>
