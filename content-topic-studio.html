eClipboard(text){try{if(!navigator.clipboard?.writeText)throw new Error('Clipboard API unavailable');await navigator.clipboard.writeText(text);return'copied'}catch(e){const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();const ok=document.execCommand('copy');area.remove();if(ok)return'copied';const shade=document.createElement('div');shade.style.cssText='position:fixed;inset:0;background:#0008;z-index:99;display:grid;place-items:center;padding:24px';const panel=document.createElement('div');panel.style.cssText='width:min(720px,100%);background:white;padding:20px;border-radius:12px';const note=document.createElement('p');note.textContent='浏览器不允许自动写入剪贴板。文本已选中，请按 ⌘C 复制。';const manual=document.createElement('textarea');manual.value=text;manual.setAttribute('readonly','');manual.style.cssText='width:100%;height:45vh;padding:12px;border:1px solid #ddd';const close=document.createElement('button');close.textContent='完成';close.style.cssText='margin-top:12px;padding:8px 16px';close.onclick=()=>shade.remove();panel.append(note,manual,close);shade.appendChild(panel);document.body.appendChild(shade);manual.focus();manual.select();return'manual'}}function copyVariant(topic,p,btn){const v=topic.platforms[p];const text=`${labels[p]}选题：${v.title}

nt.getElementById('variantCount').textContent=DATA.topics.length*3}document.querySelectorAll('.chip').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));btn.classList.add('active');active=btn.dataset.filter;render()}));render();</script></body></html>
